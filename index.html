<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoveSpot | Réservation de cours</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a href="index.html" class="text-xl font-extrabold tracking-tight text-teal-700">MoveSpot</a>
      <nav class="flex gap-4 text-sm font-medium">
        <a href="index.html" class="text-teal-700">Réserver</a>
        <!-- TODO Partie 2 : ajoutez ici le lien vers « Mes réservations » -->
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-10 px-4 py-8">

    <!-- ===== 1. Catalogue des cours ===== -->
    <section aria-labelledby="titre-cours">
      <h2 id="titre-cours" class="mb-4 text-2xl font-bold text-slate-900">Choisissez un cours</h2>
      <!-- Conteneur à manipuler : les cartes ci-dessous sont des MODÈLES HTML -->
      <div id="courses-container" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
          
          
      </div>
    </section>

    <!-- ===== 2. Créneaux ===== -->
    <section aria-labelledby="titre-creneaux">
      <h2 id="titre-creneaux" class="mb-1 text-2xl font-bold text-slate-900">Choisissez un créneau</h2>
      <p id="selected-course-title" class="mb-4 text-sm text-slate-600"></p>
      <div id="slots-container" class="flex flex-wrap gap-3">

      </div>
    </section>

    <!-- ===== 3. Plan de la salle + 4. Récapitulatif ===== -->
    <div class="grid gap-8 lg:grid-cols-3">

      <section aria-labelledby="titre-salle" class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 lg:col-span-2">
        <h2 id="titre-salle" class="mb-4 text-2xl font-bold text-slate-900">Plan de la salle</h2>
        <div class="mb-6 rounded-lg bg-slate-800 py-2 text-center text-xs font-medium text-slate-200">Espace du coach</div>

        <!-- Plan prévu pour 5 rangées (A à E) de 6 tapis -->
        <div id="seats-container" class="mx-auto grid max-w-md grid-cols-6 gap-2">

        </div>

        <ul class="mt-6 flex flex-wrap justify-center gap-5 text-sm text-slate-600">
          <li class="flex items-center gap-2"><span class="h-4 w-4 rounded border border-slate-300 bg-white"></span>Libre</li>
          <li class="flex items-center gap-2"><span class="h-4 w-4 rounded bg-teal-600"></span>Sélectionné</li>
          <li class="flex items-center gap-2"><span class="h-4 w-4 rounded bg-slate-300"></span>Occupé</li>
        </ul>
      </section>

      <aside aria-labelledby="titre-recap" class="h-fit rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <h2 id="titre-recap" class="mb-4 text-2xl font-bold text-slate-900">Récapitulatif</h2>
        <dl class="space-y-3 text-sm">
          <div class="flex justify-between gap-4"><dt class="text-slate-500">Cours</dt><dd id="summary-course" class="font-medium">Yoga Flow</dd></div>
          <div class="flex justify-between gap-4"><dt class="text-slate-500">Créneau</dt><dd id="summary-slot" class="font-medium">Lundi 18:30</dd></div>
          <div class="flex justify-between gap-4"><dt class="text-slate-500">Emplacements</dt><dd id="summary-seats" class="font-medium">C3</dd></div>
          <div class="flex justify-between gap-4"><dt class="text-slate-500">Nombre de places</dt><dd id="summary-count" class="font-medium">1</dd></div>
          <div class="flex justify-between gap-4 border-t border-slate-200 pt-3 text-base"><dt class="font-semibold">Total</dt><dd id="summary-total" class="font-bold text-teal-700">12 €</dd></div>
        </dl>

        <button id="confirm-button" type="button" class="mt-6 w-full rounded-xl bg-teal-600 px-4 py-3 font-semibold text-white transition hover:bg-teal-700">
          Confirmer la réservation
        </button>

        <!-- Message de confirmation / d'erreur : masqué au départ -->
        <p id="message" class="mt-4 hidden rounded-lg bg-teal-50 p-3 text-sm text-teal-800" role="status"></p>
      </aside>
    </div>
  </main>

  <footer class="py-8 text-center text-xs text-slate-500">MoveSpot, projet pédagogique. Aucune donnée n'est enregistrée.</footer>

  <!-- data.js doit être chargé AVANT app.js -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
